name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/carton.*/**'
      - 'carton.slnx'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/carton.*/**'
      - 'carton.slnx'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  CARGO_TERM_COLOR: always

jobs:
  csharp:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore carton.slnx

      - name: Build
        run: dotnet build carton.slnx -c Release --no-restore

      - name: Test
        run: dotnet test src/carton.GUI.Tests/carton.GUI.Tests.csproj -c Release --no-build --verbosity normal

  rust:
    name: Test (Rust ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test carton-helper
        run: cargo test --manifest-path src/carton.Helper/Cargo.toml
