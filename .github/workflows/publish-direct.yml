name: Build & Publish carton (Direct Release Upload)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3 or v1.2.3-beta.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  APP_NAME: carton

jobs:
  metadata:
    name: Resolve metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"

          if [[ -z "$tag" ]]; then
            echo "inputs.tag is required." >&2
            exit 1
          fi

          version="$tag"
          if [[ "$version" == v* ]]; then
            version="${version#v}"
          fi

          channel="release"
          is_prerelease="false"
          shopt -s nocasematch
          if [[ "$tag" == *-beta* ]] || [[ "$tag" == *-rc* ]] || [[ "$tag" == *-preview* ]] || [[ "$version" == *-beta* ]] || [[ "$version" == *-rc* ]] || [[ "$version" == *-preview* ]]; then
            channel="beta"
            is_prerelease="true"
          fi
          shopt -u nocasematch

          app_name="${APP_NAME:-carton}"
          release_name="${app_name} ${version}"

          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "is_prerelease=${is_prerelease}"
            echo "tag=${tag}"
            echo "release_name=${release_name}"
          } >> "$GITHUB_OUTPUT"

  prepare_release:
    name: Prepare GitHub release
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Verify or create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          REPO: ${{ github.repository }}
          RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists. Existing assets and release notes will be preserved."
          else
            args=("$TAG" "--repo" "$REPO" "--title" "$RELEASE_NAME")
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              args+=("--prerelease")
            fi
            target_ref="$TARGET_SHA"
            if gh api "repos/$REPO/git/ref/heads/$TAG" >/dev/null 2>&1; then
              target_ref="$TAG"
            fi
            gh release create "${args[@]}" --target "$target_ref" --notes ""
          fi

  build:
    name: Build ${{ matrix.rid }} packages
    needs:
      - metadata
      - prepare_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rid: linux-x64
            mainExe: carton
            icon: src/carton.GUI/Assets/carton_icon.png
          - os: ubuntu-22.04
            rid: linux-arm64
            mainExe: carton
            icon: src/carton.GUI/Assets/carton_icon.png
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      CHANNEL: ${{ needs.metadata.outputs.channel }}
      TAG: ${{ needs.metadata.outputs.tag }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.rid }}" in
            linux-x64) rust_target="x86_64-unknown-linux-gnu" ;;
            linux-arm64) rust_target="aarch64-unknown-linux-gnu" ;;
            *) echo "Unsupported RID: ${{ matrix.rid }}" >&2; exit 1 ;;
          esac
          rustup target add "$rust_target"

      - name: Install native dependencies (Linux)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu libc6-dev-arm64-cross zlib1g-dev libkrb5-dev pkg-config

      - name: Publish (Linux AOT)
        shell: bash
        run: |
          publish_dir_appimage="$GITHUB_WORKSPACE/artifacts/publish/${{ matrix.rid }}-appimage"
          mkdir -p "$publish_dir_appimage"
          bash scripts/build/test-publish-linux-aot.sh "${{ matrix.rid }}" Release "$publish_dir_appimage" INSTALLER_BUILD

          echo "PUBLISH_DIR_APPIMAGE=$publish_dir_appimage" >> "$GITHUB_ENV"

      - name: Create package-manager archive (Linux)
        shell: bash
        run: |
          pack_dir="$GITHUB_WORKSPACE/artifacts/pack/${{ matrix.rid }}-$CHANNEL"
          mkdir -p "$pack_dir"
          package_name="${APP_NAME}-${VERSION}-${{ matrix.rid }}-package.tar.gz"
          # INSTALLER_BUILD payload for the .deb/.rpm and for the AUR package. It must not
          # contain the portable data marker (the app would then keep config/kernel/logs
          # next to the binary, i.e. under read-only /usr) nor carton-helper (its presence
          # alone enables in-app self-updates, which would rewrite root-owned files and
          # desync the package manager database). Built without those two, the app reports
          # itself as package-manager managed and points at apt/dnf/yay instead.
          tar -C "$PUBLISH_DIR_APPIMAGE" \
            --exclude='carton-helper' \
            --exclude='.carton_portable_data' \
            --exclude='*.pdb' \
            -czf "$pack_dir/$package_name" .
          echo "PACK_DIR=$pack_dir" >> "$GITHUB_ENV"

      - name: Package .deb and .rpm (Linux)
        shell: bash
        run: |
          bash scripts/build/build-linux-packages.sh "${{ matrix.rid }}" "$VERSION" "$PUBLISH_DIR_APPIMAGE" "$PACK_DIR"

      - name: Prepare release assets (Linux)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          release_dir="$RUNNER_TEMP/release-assets-${{ matrix.rid }}"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          for pattern in '*-package.tar.gz' '*.deb' '*.rpm'; do
            for f in "$PACK_DIR"/$pattern; do
              [[ -f "$f" ]] || continue
              cp -f "$f" "$release_dir/$(basename "$f")"
            done
          done

          if ! find "$release_dir" -maxdepth 1 -type f | grep -q .; then
            echo "No release assets were prepared." >&2
            exit 1
          fi

          echo "RELEASE_ASSETS_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Upload release assets (Linux)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          uploads=("$RELEASE_ASSETS_DIR"/*)
          if [[ ${#uploads[@]} -eq 0 ]]; then
            echo "No files to upload." >&2
            exit 1
          fi

          gh release upload "$TAG" "${uploads[@]}" --repo "$REPO" --clobber
